name: Build and deploy feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feeds
        run: python build.py

      - name: Validate feeds
        run: python validate.py

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp products.csv products.parquet products.jsonl.gz index.html _site/
          for dir in */; do
            slug="${dir%/}"
            if [ -f "$slug/products.parquet" ]; then
              mkdir -p "_site/$slug"
              cp "$slug/products.csv" "$slug/products.parquet" "$slug/products.jsonl.gz" "_site/$slug/"
              find "$slug" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' \) -exec cp {} "_site/$slug/" \;
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
