# Source of truth for the OpenAI ChatGPT product feeds.
# One feed per product or catalog, each at its own stable URL:
#   https://scalytics.github.io/agent-feed/<slug>/products.parquet
# The root feed (products.parquet at the site root) is a copy of the
# Lascaris feed, so any Hosted URL already registered keeps working.
#
# Edit this file, run `python build.py`, then `python validate.py`.
# Commit the YAML and every generated products.csv, products.parquet,
# products.jsonl.gz and index.html.
#
# Do not invent a price. Do not add bundle rows.
#
# Checked against the live pages on 2026-11-14:
#   https://www.scalytics.io/lascaris
#   https://www.scalytics.io/kafshield
#   https://www.scalytics.io/helios
#   https://www.scalytics.io/kerovan
#   https://www.scalytics.io/pricing
#   https://www.scalytics.io/enablement
#   https://www.scalytics.io/imprint
#
# Kerovan and Helios yearly support prices were set by Alex on 2026-11-14.
# KafShield yearly Support and managed-on-IBM-Cloud prices were also set
# by Alex on 2026-11-14, matching the published Support and IBM Cloud
# managed amounts. Training and services prices are from /pricing.

seller:
  brand: Scalytics
  seller_name: "Scalytics, Inc"
  seller_url: https://www.scalytics.io
  seller_privacy_policy: https://www.scalytics.io/privacy
  seller_tos: https://www.scalytics.io/terms-of-service
  store_country: US
  target_countries: ["US"]

defaults:
  availability: unknown
  is_eligible_search: true
  is_eligible_checkout: false

# The root Hosted URL mirrors this product feed.
root_feed: lascaris

products:
  - id: LASCARIS
    slug: lascaris
    url: https://www.scalytics.io/lascaris
    image_url: https://cdn.prod.website-files.com/61fd00481f4b997da0ec34e3/6af2d96a092b9f7d3f84ee1b_Lascaris.png
    product_category: Software > Kafka on S3
    # Support USD is the primary Lascaris offer. Keep it first.
    offers:
      - id: SUPPORT
        title: "Lascaris Support, yearly"
        description: >-
          Lascaris Support is a yearly support package from Scalytics for
          Lascaris, the open Streamhouse that runs Kafka on object storage
          you already own. It covers the Kafka on S3 platform plus an
          immutable backup for Confluent, Apache Kafka, Redpanda and Amazon
          MSK, in your environment. Brokers are stateless and your bucket
          holds the data, so there are no broker disks to buy and no
          partitions to rebalance. Agents, policy checks and a signed audit
          trail are built in. You can run it in your cloud or data center,
          including on-premise and air-gapped sites. The package includes a
          remote onboarding configuration review (2 hours), a DORA Article 12
          and NIS2 Annex II evidence pack, a quarterly DR test runbook,
          updates and fixes for the supported release, and email support with
          a 2-business-day response. The software itself has no licence fee.
        prices:
          USD: "11750.00 USD"
          EUR: "9750.00 EUR"
      - id: OPERATED
        title: "Lascaris Operated on IBM Cloud, yearly"
        description: >-
          Lascaris Operated on IBM Cloud is a yearly package from Scalytics.
          It includes everything in Lascaris Support, and Scalytics operates
          Lascaris for you on IBM Cloud: Kafka on your own S3 plus an
          immutable backup for Confluent, Apache Kafka, Redpanda and Amazon
          MSK. Brokers are stateless and your bucket holds the data. Agents,
          policy checks and a signed audit trail are built in. The package
          includes a 1-business-day response, monthly compliance reports
          that are generated and signed, 2 TB of storage, and multi-cluster
          configuration support. The software itself has no licence fee.
        extra_storage:
          USD: "590.00 USD"
          EUR: "490.00 EUR"
        prices:
          USD: "32000.00 USD"
          EUR: "26750.00 EUR"

  - id: KAFSHIELD
    slug: kafshield
    url: https://www.scalytics.io/kafshield
    image_url: https://cdn.prod.website-files.com/61fd00481f4b997da0ec34e3/6a2bf9afed94be3f968dab38_kafshield.png
    product_category: Software > Kafka backup and disaster recovery
    # Standalone product. Do not mention Lascaris in this feed.
    offers:
      - id: SUPPORT
        title: "KafShield Support, yearly"
        description: >-
          KafShield Support is a yearly support package from Scalytics for
          KafShield, a Kafka backup and disaster recovery product on S3. It
          continuously copies your topics from Confluent, Apache Kafka,
          Redpanda or Amazon MSK into a locked, immutable backup on object
          storage you own, under object lock. Production stays untouched.
          Hot replication is not enough on its own: a delete, a bad write or
          a retention change can reach a standby cluster, while this locked
          copy sits where production credentials cannot reach it. The core is
          open source under Apache 2.0. Retention is measured in years at
          object storage prices, with point-in-time restore and eleven nines
          of durability. You run it yourself, in your cloud, on-premise or
          air-gapped. It is for platform and compliance teams that need
          recoverable, off-vendor protection for the log, including evidence
          for DORA and NIS2.
        prices:
          USD: "11750.00 USD"
          EUR: "9750.00 EUR"
      - id: MANAGED
        title: "KafShield managed on IBM Cloud, yearly"
        description: >-
          KafShield managed on IBM Cloud is a yearly package from Scalytics.
          Scalytics runs KafShield for you on IBM Cloud: Kafka backup and
          disaster recovery on S3, continuously copying topics from
          Confluent, Apache Kafka, Redpanda or Amazon MSK into a locked,
          immutable backup under object lock. Production stays untouched.
          The core is open source under Apache 2.0. Retention is measured in
          years at object storage prices, with point-in-time restore and
          eleven nines of durability. It is for platform and compliance
          teams that need recoverable, off-vendor protection for the log,
          including evidence for DORA and NIS2.
        prices:
          USD: "32000.00 USD"
          EUR: "26750.00 EUR"

  - id: KEROVAN
    slug: kerovan
    url: https://www.scalytics.io/kerovan
    image_url: https://cdn.prod.website-files.com/61fd00481f4b997da0ec34e3/6ad8cd4264eb99e2f02fdd96_og-kerovan.png
    product_category: Software > Tokenized fund operations
    offers:
      - id: SUPPORT
        title: "Kerovan Support, yearly"
        description: >-
          Kerovan Support is a yearly package from Scalytics for Kerovan, a
          reconciliation and evidence add-on for tokenized assets. It runs
          self-served on the Kafka you already have: Lascaris, or Confluent,
          Apache Kafka, Amazon MSK, Redpanda or Strimzi. Kerovan keeps
          on-chain tokens and the off-chain legal register and bank ledgers
          in step, holds what looks wrong until a person approves it, and
          records every decision in a signed audit log. It is a read-only
          plugin: data never leaves your environment and nothing writes
          back. It signs NAV and price data at the source, and can connect
          to EVM networks and Canton, the oracle you already use, and your
          custody system. It is for heads of fund operations, reconciliation,
          risk and compliance at fund administrators, transfer agents,
          custodians, and banks issuing tokenized deposits or funds.
        prices:
          USD: "35750.00 USD"
          EUR: "29750.00 EUR"
      - id: ENTERPRISE
        title: "Kerovan Enterprise, yearly"
        description: >-
          Kerovan Enterprise is a yearly package from Scalytics for Kerovan,
          a reconciliation and evidence add-on for tokenized assets. It runs
          on the Kafka you already have: Lascaris, or Confluent, Apache
          Kafka, Amazon MSK, Redpanda or Strimzi. Kerovan keeps on-chain
          tokens and the off-chain legal register and bank ledgers in step,
          holds what looks wrong until a person approves it, and records
          every decision in a signed audit log. It is a read-only plugin:
          data never leaves your environment and nothing writes back. It
          signs NAV and price data at the source. Enterprise covers more
          funds and chains than Kerovan Support, with a 1-business-day
          response and monthly signed evidence reports. It is for heads of
          fund operations, reconciliation, risk and compliance at fund
          administrators, transfer agents, custodians, and banks issuing
          tokenized deposits or funds.
        prices:
          USD: "71750.00 USD"
          EUR: "59750.00 EUR"

